server.port=${PORT:8080}
spring.application.name=lawtan-back

# ===================================================================
# Configuration Base de Données : Neon PostgreSQL
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-nameless-resonance-axyo4jaf-pooler.c-4.us-east-2.aws.neon.tech/neondb?sslmode=require}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_fjMht3i1XJBl}

# Pool de connexions dimensionne pour une petite instance et pour Neon,
# dont le nombre de connexions simultanees est limite.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# Configuration JPA / Hibernate PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ddl-auto=update relisait tout le schema Neon a chaque demarrage : 64 s de
# silence cote Hibernate en local, plusieurs minutes sur une petite instance,
# ce qui faisait expirer le deploiement Render avant l'ouverture du port.
# Le schema etant en place, on ne le rescanne plus : demarrage 84 s -> 13 s.
# Repasser a "update" via la variable d'environnement lors de l'ajout d'une
# entite ou sur une base vierge, puis revenir a "none".
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
# Ne pas garder une connexion ouverte pendant le rendu de la reponse
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Sécurité & JWT
# ===================================================================
lawtan.jwt.secret=${LAWTAN_JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
lawtan.jwt.expiration=${LAWTAN_JWT_EXPIRATION:86400000}

# ===================================================================
# CORS
# ===================================================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://lawtan.vercel.app}

# ===================================================================
# Documentation Swagger / OpenAPI
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

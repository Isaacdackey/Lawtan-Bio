server.port=${PORT:8080}
spring.application.name=lawtan-back

# ===================================================================
# Configuration Base de Données : Neon PostgreSQL
# ===================================================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Pool de connexions dimensionne pour une petite instance et pour Neon,
# dont le nombre de connexions simultanees est limite.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# Configuration JPA / Hibernate PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# ddl-auto=none : schema deja initialise avec succes.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
# Ne pas garder une connexion ouverte pendant le rendu de la reponse
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# Sécurité & JWT
# ===================================================================
lawtan.jwt.secret=${LAWTAN_JWT_SECRET}
lawtan.jwt.expiration=${LAWTAN_JWT_EXPIRATION:86400000}

# ===================================================================
# CORS
# ===================================================================
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,https://lawtan.vercel.app}

# ===================================================================
# Documentation Swagger / OpenAPI
# ===================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ===================================================================
# Réseau : connexion 4G instable (cadrage §3) -> réponses JSON compressées
# ===================================================================
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024

# Swagger public tant que SWAGGER_ENABLED n'est pas mis à false (recommandé en production)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# ===================================================================
# Cloudinary Configuration
# ===================================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER}
cloudinary.upload-preset=${CLOUDINARY_UPLOAD_PRESET:}
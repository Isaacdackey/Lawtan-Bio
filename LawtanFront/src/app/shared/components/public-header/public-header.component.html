<header class="public-navbar" [class.scrolled]="isScrolled()">
  <div class="nav-container">
    <a routerLink="/" (click)="onHomeClick($event)" class="brand" title="GIE LAWTAN Agro-Industries">
      <div class="brand-logo-wrap">
        <div class="logo-aura"></div>
        <img src="/images/Logo.png" alt="GIE LAWTAN Agro-Industries" class="brand-logo-img" />
      </div>
      <div class="brand-text">
        <span class="brand-name">LAWTAN <span class="brand-highlight">BIO</span></span>
        <span class="brand-sub">Agro-Industries & Élevage d'Élite</span>
      </div>
    </a>

    <nav class="nav-links">
      <a routerLink="/" (click)="onHomeClick($event)" [class.active]="activePage === 'accueil'" class="nav-link">
        <span>Accueil</span>
        <span class="nav-indicator"></span>
      </a>
      <a [routerLink]="['/']" [fragment]="'apropos'" (click)="scrollToSection('apropos', $event)" role="button" tabindex="0" class="nav-link">
        <span>À Propos</span>
        <span class="nav-indicator"></span>
      </a>
      <a [routerLink]="['/']" [fragment]="'pourquoi'" (click)="scrollToSection('pourquoi', $event)" role="button" tabindex="0" class="nav-link">
        <span>Pourquoi Nous</span>
        <span class="nav-indicator"></span>
      </a>
      <a [routerLink]="['/']" [fragment]="'produits'" (click)="scrollToSection('produits', $event)" role="button" tabindex="0" class="nav-link">
        <span>Gamme Laitière</span>
        <span class="nav-indicator"></span>
      </a>
      <a routerLink="/boutique" routerLinkActive="active" [class.active]="activePage === 'boutique'" (click)="closeMobileMenu()" class="nav-link">
        <span>Boutique & Ventes</span>
        <span class="nav-indicator"></span>
      </a>
      <a routerLink="/contact" routerLinkActive="active" [class.active]="activePage === 'contact'" class="nav-link">
        <span>Contact</span>
        <span class="nav-indicator"></span>
      </a>
    </nav>

    <div class="nav-actions">
      <!-- BOUTON MON PANIER EN HAUT -->
      <button type="button" class="nav-cart-pill" (click)="openCart()" aria-label="Ouvrir mon panier" title="Mon Panier">
        <div class="nav-cart-icon-wrap">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 0 1-8 0"/>
          </svg>
          <span class="nav-cart-badge" *ngIf="cartService.totalCartCount() > 0">{{ cartService.totalCartCount() }}</span>
        </div>
        <div class="nav-cart-text">
          <span class="nav-cart-label">MON PANIER</span>
          <span class="nav-cart-total">{{ cartService.totalCartAmountFcfa().toLocaleString('fr-FR') }} FCFA</span>
        </div>
      </button>

      <a routerLink="/devis" (click)="closeMobileMenu()" class="btn-devis-cta" title="Demander un Devis" aria-label="Demander un devis">
        <div class="btn-glow"></div>
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
          <line x1="16" y1="13" x2="8" y2="13"/>
          <line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
        <span>Demande de Devis</span>
      </a>

      <button class="mobile-toggle-btn" (click)="toggleMobileMenu()" aria-label="Menu Mobile" [class.open]="isMobileMenuOpen()">
        <span class="bar bar-1"></span>
        <span class="bar bar-2"></span>
        <span class="bar bar-3"></span>
      </button>
    </div>
  </div>
</header>

<div class="mobile-drawer" [class.open]="isMobileMenuOpen()">
  <div class="mobile-backdrop" (click)="closeMobileMenu()"></div>
  <div class="mobile-drawer-content">
    <div class="mobile-drawer-header">
      <div class="brand-text">
        <span class="brand-name">LAWTAN <span class="brand-highlight">BIO</span></span>
        <span class="brand-sub">Navigation mobile</span>
      </div>
      <button class="mobile-close-btn" (click)="closeMobileMenu()" aria-label="Fermer le menu">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>

    <nav class="mobile-nav-links">
      <a routerLink="/" (click)="onHomeClick($event)" role="button" class="mobile-link" [class.active-link]="activePage === 'accueil'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span>Accueil</span>
      </a>
      <a [routerLink]="['/']" [fragment]="'apropos'" (click)="scrollToSection('apropos', $event)" role="button" tabindex="0" class="mobile-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>À Propos de Nous</span>
      </a>
      <a [routerLink]="['/']" [fragment]="'pourquoi'" (click)="scrollToSection('pourquoi', $event)" role="button" tabindex="0" class="mobile-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>Pourquoi Nous ?</span>
      </a>
      <a [routerLink]="['/']" [fragment]="'produits'" (click)="scrollToSection('produits', $event)" role="button" tabindex="0" class="mobile-link">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2h8l2 5H6l2-5z"/><rect x="6" y="7" width="12" height="14" rx="2"/><line x1="10" y1="12" x2="14" y2="12"/></svg>
        <span>Notre Gamme Laitière</span>
      </a>
      <a routerLink="/boutique" (click)="closeMobileMenu()" role="button" class="mobile-link highlight-link" [class.active-link]="activePage === 'boutique'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
        <span>Boutique & Vente Directe</span>
      </a>
      <a routerLink="/devis" (click)="closeMobileMenu()" role="button" class="mobile-link" [class.active-link]="activePage === 'devis'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        <span>Demander un Devis</span>
      </a>
      <a routerLink="/contact" (click)="closeMobileMenu()" role="button" class="mobile-link" [class.active-link]="activePage === 'contact'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span>Nous Contacter</span>
      </a>
    </nav>
  </div>
</div>

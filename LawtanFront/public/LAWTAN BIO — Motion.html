<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LAWTAN BIO — Motion</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f1612;--green:#1E5E3A;--milk:#fbfaf4;--sun:#f5b82e;--ink:#e9efe9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1612}}
html,body{height:100%;margin:0;background:var(--bg);font-family:'Poppins',system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
svg{height:min(86vh,820px);max-width:100%;border-radius:18px;background:#14201a}
button{font:600 14px 'Poppins',system-ui,sans-serif;background:var(--green);color:#fff;border:0;border-radius:99px;padding:10px 22px;cursor:pointer}
text{font-family:'Poppins',system-ui,sans-serif}
.p *{animation-fill-mode:both}
/* carton */
.p #carton{animation:cin 1.1s cubic-bezier(.2,1.4,.4,1) .1s, tilt 1s ease-in-out .9s, wob 1.6s ease-in-out 1.9s infinite alternate, cout .8s ease-in 4.6s}
@keyframes cin{from{transform:translate(180px,-160px) rotate(0)}to{transform:translate(180px,110px) rotate(0)}}
@keyframes tilt{from{transform:translate(180px,110px) rotate(0)}to{transform:translate(180px,110px) rotate(140deg)}}
@keyframes wob{from{transform:translate(180px,110px) rotate(140deg)}to{transform:translate(180px,110px) rotate(144deg)}}
@keyframes cout{to{transform:translate(180px,-220px) rotate(142deg)}}
#carton{transform:translate(180px,-160px)}
/* stream */
#stream,#dash{stroke-dasharray:1;stroke-dashoffset:1}
.p #stream{animation:draw 1.6s cubic-bezier(.5,0,.3,1) 1.9s forwards, fade .5s ease 4.7s forwards}
.p #dash{animation:draw 1.6s cubic-bezier(.5,0,.3,1) 2s forwards, fade .5s ease 4.7s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:0}}
.drop{opacity:0}
.p .drop{animation:fall 1.1s ease-in infinite}
@keyframes fall{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(90px)}}
/* fill */
#fill{transform:translateY(660px)}
.p #fill{animation:rise 2.2s cubic-bezier(.6,0,.3,1) 3s forwards}
@keyframes rise{to{transform:translateY(-30px)}}
#wave{animation:slide 2.4s linear infinite}
@keyframes slide{to{transform:translateX(-360px)}}
/* text */
.t{opacity:0;transform:translateY(24px)}
.p .t{animation:up .8s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
#sun{opacity:0;transform-origin:180px 90px;transform:scale(.2)}
.p #sun{animation:sun 1.2s cubic-bezier(.2,1.4,.4,1) 5s forwards}
@keyframes sun{to{opacity:1;transform:scale(1)}}
#rays{transform-origin:180px 90px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Animation LAWTAN BIO : du lait coule et révèle la marque">
  <defs><linearGradient id="bgg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a2b21"/><stop offset="1" stop-color="#0e1712"/></linearGradient></defs>
  <rect width="360" height="640" fill="url(#bgg)"/>

  <!-- stream -->
  <path id="stream" pathLength="1" d="M203 168 C 218 300, 160 400, 175 650" fill="none" stroke="#fbfaf4" stroke-width="16" stroke-linecap="round"/>
  <path id="dash" pathLength="1" d="M204 180 C 216 300, 160 400, 175 640" fill="none" stroke="#cfdcd5" stroke-width="3" stroke-linecap="round" stroke-dasharray=".04 .06" opacity=".7"/>
  <g fill="#fbfaf4">
    <circle class="drop" cx="185" cy="500" r="5" style="animation-delay:2.9s"/>
    <circle class="drop" cx="160" cy="460" r="3.5" style="animation-delay:3.3s"/>
    <circle class="drop" cx="195" cy="430" r="4" style="animation-delay:3.7s"/>
  </g>

  <!-- carton -->
  <g id="carton">
    <g transform="translate(-60,-60)">
      <polygon points="12,34 60,-4 108,34" fill="#f7f5ee"/>
      <rect x="2" y="26" width="116" height="118" rx="12" fill="#1E5E3A" stroke="#14452a" stroke-width="4"/>
      <rect x="2" y="58" width="116" height="44" fill="#f7f5ee"/>
      <text x="60" y="90" text-anchor="middle" font-size="30" font-weight="800" fill="#1E5E3A" letter-spacing="2">BIO</text>
      <rect x="22" y="-22" width="14" height="14" fill="#c98a3a" stroke="#7a4a17" stroke-width="2" transform="rotate(-20 29 -15)"/>
      <circle cx="78" cy="2" r="12" fill="#f5b82e" stroke="#a55a12" stroke-width="3"/>
    </g>
  </g>

  <!-- milk fill -->
  <g id="fill">
    <g id="wave"><path d="M0 30 Q 45 0 90 30 T 180 30 T 270 30 T 360 30 T 450 30 T 540 30 T 630 30 T 720 30 V 800 H0 Z" fill="#fbfaf4"/></g>
  </g>

  <!-- brand reveal -->
  <g id="sun"><g id="rays" stroke="#f5b82e" stroke-width="3" stroke-linecap="round">
    <line x1="180" y1="52" x2="180" y2="40"/><line x1="180" y1="128" x2="180" y2="140"/>
    <line x1="142" y1="90" x2="130" y2="90"/><line x1="218" y1="90" x2="230" y2="90"/>
    <line x1="153" y1="63" x2="145" y2="55"/><line x1="207" y1="117" x2="215" y2="125"/>
    <line x1="207" y1="63" x2="215" y2="55"/><line x1="153" y1="117" x2="145" y2="125"/></g>
    <circle cx="180" cy="90" r="26" fill="#f5b82e"/></g>

  <text class="t" style="animation-delay:5.3s" x="180" y="300" text-anchor="middle" font-size="52" font-weight="800" fill="#1E5E3A" letter-spacing="3">LAWTAN</text>
  <text class="t" style="animation-delay:5.6s" x="180" y="352" text-anchor="middle" font-size="44" font-weight="800" fill="#c98a3a" letter-spacing="14">BIO</text>
  <text class="t" style="animation-delay:6.1s" x="180" y="400" text-anchor="middle" font-size="15" font-weight="600" fill="#2b4a38">Lait frais · 100% solaire</text>
  <text class="t" style="animation-delay:6.3s" x="180" y="424" text-anchor="middle" font-size="13" font-weight="600" fill="#5b7a67">Élevage d'élite · Dagana, Sénégal</text>
  <g class="t" style="animation-delay:6.9s">
    <rect x="52" y="490" width="256" height="46" rx="23" fill="#1E5E3A"/>
    <text x="180" y="519" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">lawtan-front.vercel.app</text>
  </g>
</svg>
<button id="replay" type="button">↻ Rejouer</button>
<script>
const s=document.getElementById('stage');let timer;
function play(){clearTimeout(timer);s.classList.remove('p');void s.getBoundingClientRect();s.classList.add('p');timer=setTimeout(play,12500)}
document.getElementById('replay').onclick=play;play();
</script>
</body>
</html>
